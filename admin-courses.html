<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacity Connect - Admin Courses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h2>Capacity Connect</h2>
        <div>
            <a href="courses.html">Courses</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="materials.html">Materials</a>
            <a href="admin-courses.html">Admin</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>
    <div class="page-hero">
        <div class="page-hero-inner">
            <h1>Manage Courses</h1>
            <p>Add new courses or update and remove existing ones.</p>
        </div>
    </div>
    <div class="page">
        <div class="course-card">
            <span class="field-label">Course Title</span>
            <input type="text" id="course-title" placeholder="e.g. Introduction to Data Analysis">
            <span class="field-label">Description</span>
            <textarea id="course-description" placeholder="Short description of what this course covers"></textarea>
            <br><br>
            <button onclick="saveCourse()">Add Course</button>
            <button id="cancel-edit-btn" class="hidden" onclick="cancelEdit()">Cancel Edit</button>
            <p id="course-message"></p>
        </div>

        <h2 style="margin-top:32px;">Existing Courses</h2>
        <div id="admin-courses-list">
            <p>Loading courses...</p>
        </div>
    </div>
    <script src="admin-courses.js"></script>
</body>
</html>
