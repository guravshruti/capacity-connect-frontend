<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacity Connect - Announcements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h2>Capacity Connect</h2>
        <div>
            <a href="courses.html">Courses</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="materials.html">Materials</a>
            <a href="admin-courses.html">Admin</a>
            <a href="analytics.html">Analytics</a>
            <a href="certificates.html">Certificates</a>
            <a href="announcements.html">Announcements</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>
    <div class="page-hero">
        <div class="page-hero-inner">
            <h1>Announcements</h1>
            <p>Updates and news from the Capacity Connect team.</p>
        </div>
    </div>
    <div class="page">
        <div class="course-card">
            <span class="field-label">Title</span>
            <input type="text" id="announcement-title" placeholder="e.g. New course launching next week">
            <span class="field-label">Message</span>
            <textarea id="announcement-message" placeholder="Write your announcement here..."></textarea>
            <br><br>
            <button onclick="postAnnouncement()">Post Announcement</button>
            <p id="announcement-message-box"></p>
        </div>

        <h2 style="margin-top:32px;">Latest</h2>
        <div id="announcements-list">
            <p>Loading announcements...</p>
        </div>
    </div>
    <script src="announcements.js"></script>
</body>
</html>
